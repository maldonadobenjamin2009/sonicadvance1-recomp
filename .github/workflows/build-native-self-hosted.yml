name: Build Sonic Advance Windows EXE (local runner)

# Intentionally workflow_dispatch-only. This compiles ROM-derived code on the
# owner's own Windows machine and does not upload the resulting game build as a
# public artifact from this public repository.
on:
  workflow_dispatch:
    inputs:
      rom_path:
        description: Absolute path to your own supported Sonic Advance USA .gba
        required: true
        type: string
      bios_path:
        description: Absolute path to your own compatible GBA BIOS .bin
        required: true
        type: string
      output_dir:
        description: Local folder for the release ZIP
        required: true
        default: 'C:\SonicAdvanceRecomp-release'
        type: string

permissions:
  contents: read

concurrency:
  group: sonic-advance-self-hosted-native-build
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check local MINGW64 toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mingw = 'C:\msys64\mingw64\bin'
          foreach ($exe in @('gcc.exe', 'g++.exe', 'cmake.exe', 'ninja.exe')) {
            if (-not (Test-Path (Join-Path $mingw $exe))) {
              throw "Missing $exe in $mingw. Install the MSYS2 MINGW64 toolchain, CMake, Ninja and SDL2 first."
            }
          }
          "$mingw" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'C:\msys64\usr\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$mingw;C:\msys64\usr\bin;$env:Path"
          cmake --version
          ninja --version
          g++ --version

      - name: Generate the private BIOS/game C++ and build the combined executable
        shell: pwsh
        env:
          ROM_PATH: ${{ inputs.rom_path }}
          BIOS_PATH: ${{ inputs.bios_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\build-native.ps1 -Rom $env:ROM_PATH -Bios $env:BIOS_PATH
          if (-not (Test-Path '.\build-native\SonicAdvanceRecomp.exe')) {
            throw 'The combined SonicAdvanceRecomp.exe was not produced.'
          }

      - name: Package the EXE, launcher assets and required runtime DLLs locally
        shell: pwsh
        env:
          OUTPUT_DIR: ${{ inputs.output_dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:OUTPUT_DIR)) {
            throw 'Set an output_dir on your Windows computer.'
          }
          $output = [System.IO.Path]::GetFullPath($env:OUTPUT_DIR)
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $stage = Join-Path $output 'SonicAdvanceRecomp-windows-x64'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item '.\build-native\SonicAdvanceRecomp.exe' $stage
          $assets = '.\build-native\assets'
          if (Test-Path $assets) {
            Copy-Item $assets (Join-Path $stage 'assets') -Recurse -Force
          }

          # Match the runtime payload style used by MinishCapRecomp releases.
          # Never copy the ROM, BIOS, generated source, or local game config.
          $mingw = 'C:\msys64\mingw64\bin'
          foreach ($dll in @('SDL2.dll', 'libstdc++-6.dll', 'libgcc_s_seh-1.dll', 'libwinpthread-1.dll')) {
            $sourceDll = Join-Path $mingw $dll
            if (Test-Path $sourceDll) { Copy-Item $sourceDll $stage -Force }
          }

          $zip = Join-Path $output 'SonicAdvanceRecomp-windows-x64.zip'
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Combined launcher/game package created locally at: $zip"
          Write-Host 'The ZIP was not uploaded to GitHub Actions artifacts.'
