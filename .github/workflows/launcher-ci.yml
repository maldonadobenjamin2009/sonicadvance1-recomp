name: Launcher CI

on:
  push:
    branches: [main]
    paths:
      - "launcher/**"
      - ".github/workflows/launcher-ci.yml"
  pull_request:
    paths:
      - "launcher/**"
      - ".github/workflows/launcher-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-launcher:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Windows launcher
        run: dotnet publish .\launcher\SonicAdvanceLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\artifacts\launcher
      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonicAdvanceLauncher-windows-x64
          path: artifacts/launcher/
          if-no-files-found: error
          retention-days: 14
