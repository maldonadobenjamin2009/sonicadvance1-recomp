name: GBARecomp Toolchain CI

on:
  push:
    branches: [main]
    paths:
      - ".gitmodules"
      - "CMakeLists.txt"
      - "game.toml"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/native-runtime-ci.yml"
  pull_request:
    paths:
      - ".gitmodules"
      - "CMakeLists.txt"
      - "game.toml"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/native-runtime-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-recompiler:
    runs-on: windows-latest
    steps:
      - name: Checkout with pinned GBARecomp runtime
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MinGW, CMake, Ninja and SDL2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2

      - name: Build the runtime-compatible recompiler
        shell: msys2 {0}
        run: |
          cmake -S gbarecomp -B gbarecomp/build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DGBARECOMP_COMPILER_CACHE=OFF
          cmake --build gbarecomp/build-native --target gba_recompile --parallel 2
          test -s gbarecomp/build-native/gba_recompile.exe
          echo "The GBARecomp recompiler compiled successfully."

      - name: Verify runtime integration sources
        shell: bash
        run: |
          set -euo pipefail
          test -f CMakeLists.txt
          test -f game.toml
          test -f src/main.cpp
          grep -q 'path = gbarecomp' .gitmodules
          echo "The pinned runtime and Sonic Advance runner scaffold are present."
          echo "Game-derived generated sources are intentionally absent from public CI."
